
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-health-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: network-health-monitor
  template:
    metadata:
      labels:
        app: network-health-monitor
    spec:
      containers:
        - name: network-health-monitor
          image: tanvinewase/network-health-monitor:8
          ports:
            - containerPort: 5000
                    readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3